name: Release

# Publishes to PyPI when a v* tag is pushed, via PyPI Trusted Publishing (OIDC).
# Configure on PyPI first (https://docs.pypi.org/trusted-publishers/):
# project "strava-globe", repository lukaszkolodziejczyk/strava-globe,
# workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: |
          uvx --from ./dist/*.whl strava-globe --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: build
    # workflow_dispatch may build artifacts, but only tag pushes publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
